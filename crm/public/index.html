<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard — Kareem Elkhatib</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/crm.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/ui.js" defer></script>
  <script src="/js/dashboard.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="topbar__brand" href="/">K.</a>
      <nav class="topbar__nav" aria-label="Primary">
        <a class="topbar__link" href="/" aria-current="page">Dashboard</a>
        <a class="topbar__link" href="/vault.html">Files</a>
        <a class="topbar__link" href="/notes.html">Notes</a>
        <a class="topbar__link" href="/shares.html">Shares</a>
        <button class="btn btn--ghost btn--sm" id="logout-btn" type="button">Sign out</button>
      </nav>
    </div>
  </header>

  <main class="shell">
    <h1 class="reveal">Dashboard</h1>
    <p class="auth__sub reveal" style="--i:1">Saved links, a clipboard that syncs between your devices, and your latest uploads.</p>

    <div class="grid grid--main">
      <section class="card reveal" style="--i:2" aria-labelledby="links-title">
        <div class="card__title">
          <h2 id="links-title">Saved links</h2>
          <div>
            <button class="btn btn--ghost btn--sm" id="edit-links" type="button">Edit</button>
            <button class="btn btn--ghost btn--sm" id="add-link" type="button">+ Add</button>
          </div>
        </div>
        <div class="links-grid" id="links-grid"></div>
      </section>

      <section class="card reveal" style="--i:3" aria-labelledby="clip-title">
        <div class="card__title">
          <h2 id="clip-title">Synced clipboard</h2>
        </div>
        <textarea class="input clipboard__area" id="clipboard"
                  placeholder="Paste anything here — it syncs to your other devices."></textarea>
        <p class="clipboard__status" id="clip-status" role="status"></p>
      </section>
    </div>

    <section class="card reveal" style="--i:4; margin-top: var(--space-md);" aria-labelledby="recent-title">
      <div class="card__title">
        <h2 id="recent-title">Recently uploaded files</h2>
        <a class="topbar__link" href="/vault.html">All files →</a>
      </div>
      <div class="file-list" id="recent-files"></div>
    </section>
  </main>

  <dialog class="modal" id="link-modal">
    <form method="dialog" id="link-form">
      <h2>Add quick link</h2>
      <div class="field">
        <label class="field__label" for="link-title">Title</label>
        <input class="input" id="link-title" type="text" maxlength="200" required>
      </div>
      <div class="field">
        <label class="field__label" for="link-url">URL</label>
        <input class="input" id="link-url" type="url" placeholder="https://…" required>
      </div>
      <div class="field">
        <label class="field__label" for="link-icon">Emoji icon (optional)</label>
        <input class="input" id="link-icon" type="text" maxlength="8" placeholder="🔗">
      </div>
      <button class="btn btn--accent" value="save" type="submit">Save</button>
      <button class="btn btn--ghost" value="cancel" formnovalidate>Cancel</button>
    </form>
  </dialog>
</body>
</html>
