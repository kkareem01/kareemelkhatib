name: Deploy CRM Worker

on:
  push:
    branches: [main]
    paths: ["crm/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 47b2c69ae80a39b01f2ff24747f13c5a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply crm-db --remote

      - name: Deploy
        run: npx wrangler deploy
